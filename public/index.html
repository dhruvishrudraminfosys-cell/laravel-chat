<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4e6ef2 0%, #7b5cf0 50%, #a35ce0 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .join-box {
            background: rgba(255, 255, 255, 0.97);
            padding: 45px 40px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4e6ef2, #7b5cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 8px 20px rgba(78, 110, 242, 0.35);
        }

        .icon-circle svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
        }

        .join-box h2 {
            color: #1e1e2f;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .join-box p {
            color: #8a8a9a;
            font-size: 13.5px;
            margin-bottom: 26px;
        }

        .join-box input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1.5px solid #e4e4ee;
            outline: none;
            font-size: 14.5px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .join-box input:focus {
            border-color: #4e6ef2;
            box-shadow: 0 0 0 4px rgba(78, 110, 242, 0.12);
        }

        .error {
            color: #ff5c6c;
            font-size: 12.5px;
            margin-top: 8px;
            text-align: left;
            display: none;
        }

        .join-box button {
            display: block;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4e6ef2, #7b5cf0);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .join-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(78, 110, 242, 0.35);
        }

        .join-box button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="join-box">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </div>
        <h2>Join the Chat</h2>
        <p>Enter your name to start chatting</p>
        <input type="text" id="username" placeholder="Your name" maxlength="20" autocomplete="off">
        <div class="error" id="errorMsg">Please enter your name</div>
        <button id="joinBtn">Join Chat</button>
    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const joinBtn = document.getElementById('joinBtn');
        const errorMsg = document.getElementById('errorMsg');

        function joinChat() {
            const username = usernameInput.value.trim();
            if (!username) {
                errorMsg.style.display = 'block';
                usernameInput.focus();
                return;
            }
            localStorage.setItem('chatUsername', username);
            window.location.href = 'chat';
        }

        joinBtn.addEventListener('click', joinChat);

        usernameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') joinChat();
        });

        usernameInput.addEventListener('input', () => {
            errorMsg.style.display = 'none';
        });
    </script>

</body>

</html>
